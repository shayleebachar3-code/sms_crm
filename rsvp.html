<html lang="he" dir="rtl">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#05070d;--card:#0e1320;--card2:#121a2b;--ink:#f3efe6;--soft:#b9b4a6;--line:#273049;--acc:#e1bf78;--acc2:#c9a45c;--good:#58c58a;--bad:#ff8a80}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse 900px 420px at 50% -120px,rgba(201,164,92,.16),rgba(201,164,92,0) 70%),var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:17px;line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
.w{max-width:640px;margin:0 auto;padding:0 16px}
.hdr{border-bottom:1px solid var(--line);padding:14px 0;background:rgba(8,11,20,.85)}
.hdr .w{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:700;letter-spacing:.16em;color:var(--acc);direction:ltr}.hsub{color:var(--soft);font-size:14px}
.msg{text-align:center;padding:64px 8px;color:var(--soft)}
.msg b{display:block;color:var(--ink);font-size:21px;margin-bottom:8px}
h1{font-family:'Frank Ruhl Libre',serif;font-size:32px;line-height:1.2;margin:28px 0 6px}
h1 em{font-style:normal;color:var(--acc)}
.lead{color:var(--soft);margin:0 0 20px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.ev div span{display:block;font-size:13px;color:var(--soft)}.ev div b{font-weight:600}
.ev .pk{color:var(--acc);letter-spacing:.08em;direction:ltr;display:inline-block}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}
.step h2{font-size:19px;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.step h2 i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid var(--acc2);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.step .hint{color:var(--soft);font-size:14.5px;margin:0 0 12px}
.num{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 4px}

.choice{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card2)}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:#e1bf78;flex:none}
.opt:has(input:checked){border-color:var(--acc);background:rgba(225,191,120,.08)}
.opt small{display:block;color:var(--soft);font-size:13.5px}
.items{display:grid;gap:10px;margin-top:14px}
.it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card2)}
.it .nm{display:flex;justify-content:space-between;gap:8px;font-weight:500;margin-bottom:8px}
.it .nm small{color:var(--soft);font-weight:400;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-size:14.5px;color:var(--soft)}
.seg input:checked+span{border-color:var(--acc);color:#1a1308;background:linear-gradient(135deg,#f3e1b6,#d9ba7c);font-weight:700}
.seg input:checked+span.rm{background:#3a1d1d;border-color:var(--bad);color:var(--bad)}
.seg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.f{display:block;margin:0 0 14px}.f>span{display:block;color:var(--soft);font-size:14.5px;margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#080b14;color:var(--ink);font:inherit;font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pad{position:relative;background:#fff;border-radius:14px;border:2px dashed #8a8a8a;height:190px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:12px;touch-action:none}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;pointer-events:none}
.chk{display:flex;gap:12px;align-items:flex-start;margin:14px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:3px;accent-color:#e1bf78;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:14px;padding:15px 26px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#f3e1b6,#d9ba7c);color:#1a1308;font-size:17px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:10px 18px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--bad);min-height:24px;margin:10px 0 0;font-size:15.5px}
.ok{background:#0f2a1d;border:1px solid #1f6b46;border-radius:16px;padding:22px;margin:28px 0 16px;text-align:center}
.ok b{color:var(--good);font-size:22px;display:block;margin-bottom:6px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 16px}
.sum dl{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin:0}.sum dt{color:var(--soft)}.sum dd{margin:0}
.sig{max-width:240px;background:#fff;border-radius:8px;padding:6px;display:block;margin-top:8px}
.foot{text-align:center;color:var(--soft);font-size:13.5px;margin:22px 0 32px}
.foot a{color:var(--acc)}
[hidden]{display:none!important}
@media(max-width:480px){h1{font-size:27px}.two{grid-template-columns:1fr}.sum dl{grid-template-columns:1fr;gap:0}.sum dt{margin-top:8px}.seg span{font-size:13.5px}}
@media print{body{background:#fff;color:#000}.hdr,.row,.foot,.noprint{display:none}.sum,.ok{background:#fff;border-color:#999;color:#000}.ok b{color:#000}}
</style>

      (tierName ? '<dt>מעבר חבילה</dt><dd>' + esc(tierName) + '</dd>' : '') + (a.add ? '<dt>בקשות</dt><dd>' + esc(a.add) + '</dd>' : '') +

  }

  function render(r, fresh) {
